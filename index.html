<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>International Debt Statistics: Country standard table</title>
<link rel="stylesheet" href="ids-dashboard.css?v=4">
</head>
<body>
<div class="band"></div>
<header>
  <h1>International Debt Statistics <small id="table-title"></small></h1>
  <div class="controls">
    <label class="control"><strong>Country or group</strong>
      <select id="country" disabled><option>Loading…</option></select>
    </label>
    <div class="control"><strong>Counterpart-Area</strong>
      <div class="fixed-value">World</div>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
</header>
<div id="message"></div>
<main id="table-area"><table id="table" hidden></table></main>
<footer>
  <p id="note"></p>
  <p id="source"></p>
</footer>

<script src="ids-core.js?v=4"></script>
<script src="table-definition.js?v=4"></script>
<script src="ids-dashboard.js?v=4"></script>
</body>
</html>
